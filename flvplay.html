<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple FLV Web Player</title>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .wrapper {
      width: 90%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .controls {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #161b22;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    input:focus { border-color: #58a6ff; }
    button {
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      background: #238636;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { background: #2ea043; }
    video {
      width: 100%;
      background: #000;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      aspect-ratio: 16/9;
    }
    #status {
      font-size: 14px;
      color: #8b949e;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="controls">
      <input type="text" id="urlInput" placeholder="Paste .flv URL here (or use ?url=...)" />
      <button onclick="loadStream()">Play</button>
    </div>
    <video id="videoElement" controls autoplay></video>
    <div id="status">Ready. Paste a link or pass it via URL parameters.</div>
  </div>

  <script>
    const videoElement = document.getElementById('videoElement');
    const urlInput = document.getElementById('urlInput');
    const statusEl = document.getElementById('status');
    let player = null;

    function playFlv(rawUrl) {
      if (!rawUrl) return;

      if (player) {
        player.pause();
        player.unload();
        player.detachMediaElement();
        player.destroy();
        player = null;
      }

      // Automatically wrap external stream URLs through a public CORS proxy 
      // to bypass connection resets and CDN restrictions, just like online players do.
      const targetUrl = rawUrl.startsWith('http') && !rawUrl.includes('corsproxy.io') 
        ? 'https://corsproxy.io/?' + encodeURIComponent(rawUrl) 
        : rawUrl;

      statusEl.textContent = 'Connecting to stream...';

      player = mpegts.createPlayer({
        type: 'flv',
        isLive: true,
        url: targetUrl
      }, {
        enableStashBuffer: false,
        liveBufferLatencyChasing: true
      });

      player.attachMediaElement(videoElement);
      player.load();
      player.play().then(() => {
        statusEl.textContent = 'Stream playing successfully.';
      }).catch(err => {
        statusEl.textContent = 'Playback initialized. Click play on the video player if autoplay was restricted.';
      });

      player.on(mpegts.Events.ERROR, (errType, errDetail) => {
        statusEl.textContent = `Error: ${errType} - ${errDetail}`;
      });
    }

    function loadStream() {
      const val = urlInput.value.trim();
      if (!val) return;
      const newUrl = new URL(window.location);
      newUrl.searchParams.set('url', val);
      window.history.pushState({}, '', newUrl);
      playFlv(val);
    }

    // Automatically read and play from URL query parameters on page load
    const params = new URLSearchParams(window.location.search);
    const initialUrl = params.get('url');
    if (initialUrl) {
      urlInput.value = initialUrl;
      playFlv(initialUrl);
    }
  </script>
</body>
</html>
